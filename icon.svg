<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e05c74"/>
      <stop offset="100%" stop-color="#b83050"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Soft inner glow -->
  <ellipse cx="256" cy="256" rx="180" ry="180" fill="rgba(255,255,255,0.07)"/>

  <!-- Clock body circle -->
  <circle cx="256" cy="278" r="148" fill="none" stroke="url(#ring)" stroke-width="24" stroke-linecap="round"/>

  <!-- Tick marks (12, 3, 6, 9 o'clock) -->
  <line x1="256" y1="140" x2="256" y2="162" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <line x1="394" y1="278" x2="372" y2="278" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <line x1="256" y1="416" x2="256" y2="394" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <line x1="118" y1="278" x2="140" y2="278" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

  <!-- Hour hand (pointing to ~10) -->
  <line x1="256" y1="278" x2="200" y2="210" stroke="white" stroke-width="20" stroke-linecap="round"/>

  <!-- Minute hand (pointing to 12) -->
  <line x1="256" y1="278" x2="256" y2="168" stroke="white" stroke-width="14" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="278" r="14" fill="white"/>

  <!-- Crown / stem at top -->
  <rect x="226" y="96" width="60" height="18" rx="9" fill="white" opacity="0.85"/>
  <!-- Crown guards -->
  <rect x="194" y="78" width="50" height="14" rx="7" fill="white" opacity="0.7"/>
  <rect x="268" y="78" width="50" height="14" rx="7" fill="white" opacity="0.7"/>
</svg>
