<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimerGo</title>
    <meta name="description" content="A beautiful, installable Pomodoro & multi-timer app with custom profiles.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== DESIGN TOKENS ===== */
        :root {
            --accent: #e05c74;
            --accent-glow: rgba(224, 92, 116, 0.3);
            --card-bg: rgba(12, 12, 18, 0.82);
            --surface: rgba(255, 255, 255, 0.06);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.09);
            --text-primary: #f0f0f5;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --radius-lg: 1.5rem;
            --radius-md: 0.75rem;
            --radius-sm: 0.5rem;
            --transition-color: background-color 0.6s cubic-bezier(.4,0,.2,1), color 0.6s ease;
            --ring-size: 260px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0b0c14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Blurred background blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.22;
            pointer-events: none;
            z-index: 0;
            transition: background 0.7s ease;
        }
        body::before {
            width: 55vw; height: 55vw;
            top: -15vw; left: -15vw;
            background: var(--accent);
        }
        body::after {
            width: 45vw; height: 45vw;
            bottom: -15vw; right: -15vw;
            background: var(--accent);
            opacity: 0.16;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            display: flex;
            gap: 0.5rem;
            z-index: 50;
        }

        .icon-btn {
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
        }
        .icon-btn:hover { background: rgba(0,0,0,0.45); transform: scale(1.08); }
        .icon-btn:active { transform: scale(0.94); }
        .icon-btn svg { width: 1.1rem; height: 1.1rem; }

        /* ===== MAIN CARD ===== */
        .container {
            position: relative;
            z-index: 10;
            width: min(420px, 92vw);
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 2rem;
            box-shadow: 0 32px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05) inset;
            padding: 2rem 2rem 2.5rem;
            text-align: center;
            animation: card-in 0.5s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== HEADER ===== */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: var(--text-primary);
        }
        .logo span { color: var(--accent); }

        .select-wrapper {
            position: relative;
        }
        .select-wrapper::after {
            content: '⌄';
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-55%);
            font-size: 1rem;
            color: var(--text-secondary);
            pointer-events: none;
            line-height: 1;
        }

        select#profile-select {
            appearance: none;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.4rem 2rem 0.4rem 0.85rem;
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: background 0.2s;
            max-width: 150px;
        }
        select#profile-select:hover { background: var(--surface-hover); }

        /* ===== PHASE TABS ===== */
        .phases-strip {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 1.75rem;
        }

        .phase-tab {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .phase-tab:hover { background: var(--surface-hover); color: var(--text-primary); }
        .phase-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* ===== PROGRESS RING ===== */
        .ring-wrapper {
            position: relative;
            width: var(--ring-size);
            height: var(--ring-size);
            margin: 0 auto 2rem;
        }

        .progress-ring {
            width: 100%; height: 100%;
            transform: rotate(-90deg);
        }

        .ring-track {
            fill: none;
            stroke: rgba(255,255,255,0.08);
            stroke-width: 6;
        }

        .ring-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s linear, stroke 0.6s ease;
            filter: drop-shadow(0 0 6px var(--accent-glow));
        }

        .ring-inner {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
        }

        .timer-display {
            font-size: 4rem;
            font-weight: 800;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.05em;
            line-height: 1;
            cursor: pointer;
            transition: opacity 0.2s;
            user-select: none;
        }
        .timer-display:hover { opacity: 0.75; }

        .phase-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        .start-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.9rem 2.75rem;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px var(--accent-glow);
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.6s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
            letter-spacing: 0.02em;
        }
        .start-btn:hover { transform: scale(1.05); box-shadow: 0 12px 32px var(--accent-glow); }
        .start-btn:active { transform: scale(0.96); }

        .icon-round-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .icon-round-btn:hover { background: var(--surface-hover); color: var(--text-primary); transform: scale(1.05); }
        .icon-round-btn:active { transform: scale(0.94); }
        .icon-round-btn svg { width: 1.2rem; height: 1.2rem; }

        .hidden { display: none !important; }

        /* ===== DRAWER ===== */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .drawer-overlay.active { opacity: 1; pointer-events: auto; }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(420px, 100vw);
            background: #111117;
            border-left: 1px solid rgba(255,255,255,0.08);
            z-index: 201;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(.22,1,.36,1);
            overflow: hidden;
        }
        .drawer-overlay.active .drawer { transform: translateX(0); }

        .drawer-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .drawer-title { font-size: 1.15rem; font-weight: 700; color: #fff; }

        .drawer-close {
            background: rgba(255,255,255,0.07);
            border: none;
            color: rgba(255,255,255,0.6);
            width: 2.2rem;
            height: 2.2rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: background 0.2s, color 0.2s;
        }
        .drawer-close:hover { background: rgba(255,255,255,0.12); color: #fff; }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Drawer scrollbar */
        .drawer-body::-webkit-scrollbar { width: 4px; }
        .drawer-body::-webkit-scrollbar-track { background: transparent; }
        .drawer-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

        /* ===== DRAWER SECTIONS ===== */
        .section-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-bottom: 0.75rem;
        }

        .profile-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: var(--radius-md);
            padding: 0.9rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
        }
        .profile-card:hover { background: rgba(255,255,255,0.08); }
        .profile-card.active-profile { border-color: var(--accent); background: rgba(244,63,94,0.08); }

        .profile-card-left { display: flex; align-items: center; gap: 0.75rem; }

        .profile-card-swatch {
            display: flex;
            gap: 2px;
        }
        .swatch-dot { width: 8px; height: 8px; border-radius: 50%; }

        .profile-card-info .name { font-size: 0.9rem; font-weight: 600; color: #fff; }
        .profile-card-info .meta { font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-top: 0.15rem; }

        .profile-delete-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.25);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 0.25rem;
            transition: color 0.2s, background 0.2s;
            display: flex;
        }
        .profile-delete-btn:hover { color: #ef4444; background: rgba(239,68,68,0.1); }

        /* ===== BUILDER ===== */
        .builder-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: var(--radius-md);
            padding: 1.25rem;
        }
        .builder-card .section-label { margin-bottom: 1rem; }

        .field-group { margin-bottom: 0.85rem; }
        .field-group label { display: block; font-size: 0.75rem; font-weight: 600; color: rgba(255,255,255,0.5); margin-bottom: 0.35rem; }
        .field-group input[type="text"],
        .field-group input[type="number"] {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            padding: 0.55rem 0.75rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .field-group input:focus { border-color: var(--accent); }
        .field-group input::placeholder { color: rgba(255,255,255,0.25); }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .toggle-row:last-of-type { border-bottom: none; }
        .toggle-label { font-size: 0.85rem; font-weight: 500; color: rgba(255,255,255,0.7); }

        /* Toggle switch */
        .toggle { position: relative; width: 2.5rem; height: 1.4rem; }
        .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
        .toggle-track {
            position: absolute; inset: 0;
            background: rgba(255,255,255,0.12);
            border-radius: 9999px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-track::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 1rem; height: 1rem;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s cubic-bezier(.22,1,.36,1);
        }
        .toggle input:checked + .toggle-track { background: var(--accent); }
        .toggle input:checked + .toggle-track::after { transform: translateX(1.1rem); }

        .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 0.5rem 0; }

        /* Phase builder row */
        .phase-builder-inputs {
            display: grid;
            grid-template-columns: 1fr 80px;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .color-swatches { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
        .swatch-btn {
            width: 1.75rem; height: 1.75rem;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }
        .swatch-btn:hover { transform: scale(1.15); }
        .swatch-btn.selected { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.3); }
        .swatch-btn.custom-swatch { background: conic-gradient(red, orange, yellow, green, blue, violet, red); border-radius: 50%; overflow: hidden; }
        .swatch-btn.custom-swatch input[type="color"] { width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .draft-phase-list { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.75rem; }
        .draft-phase-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            border-radius: var(--radius-sm);
            padding: 0.5rem 0.75rem;
            font-size: 0.82rem;
            font-weight: 500;
            color: rgba(255,255,255,0.8);
        }
        .draft-phase-item-left { display: flex; align-items: center; gap: 0.5rem; }
        .draft-dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; flex-shrink: 0; }
        .draft-remove {
            background: none; border: none; color: rgba(255,255,255,0.3);
            cursor: pointer; padding: 0.1rem; font-size: 0.9rem; line-height: 1;
            transition: color 0.2s;
        }
        .draft-remove:hover { color: #ef4444; }

        /* Buttons inside drawer */
        .drawer-btn {
            width: 100%;
            padding: 0.65rem;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .drawer-btn-ghost {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .drawer-btn-ghost:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .drawer-btn-accent {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .drawer-btn-accent:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 20px var(--accent-glow); }

        .drawer-btn-row { display: flex; gap: 0.5rem; }
        .drawer-btn-row .drawer-btn { flex: 1; }

        /* ===== COMPLETION FLASH ===== */
        @keyframes flash-done {
            0%   { opacity: 0; }
            20%  { opacity: 1; }
            80%  { opacity: 1; }
            100% { opacity: 0; }
        }
        .done-flash {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.12);
            pointer-events: none;
            z-index: 500;
            animation: flash-done 1.5s ease forwards;
        }

        /* Small icons within text flow */
        svg.inline-icon { width: 1rem; height: 1rem; vertical-align: -2px; }
    </style>
</head>
<body>

    <!-- Toolbar -->
    <div class="toolbar">
        <button class="icon-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
            </svg>
        </button>
        <button class="icon-btn" onclick="openSettings()" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
        </button>
    </div>

    <!-- Main Card -->
    <div class="container">
        <!-- Header -->
        <div class="app-header">
            <div class="logo">Timer<span>Go</span></div>
            <div class="select-wrapper">
                <select id="profile-select"></select>
            </div>
        </div>

        <!-- Phase tabs -->
        <div class="phases-strip" id="phases-container"></div>

        <!-- SVG Progress Ring -->
        <div class="ring-wrapper">
            <svg class="progress-ring" viewBox="0 0 260 260" aria-hidden="true">
                <circle class="ring-track" cx="130" cy="130" r="118"/>
                <circle class="ring-progress" id="ring-progress" cx="130" cy="130" r="118"
                    stroke-dasharray="741.4"
                    stroke-dashoffset="0"/>
            </svg>
            <div class="ring-inner">
                <div class="timer-display" id="timer-display" onclick="editTimer()" title="Click to edit">25:00</div>
                <div class="phase-label" id="phase-label">Work</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="icon-round-btn" onclick="skipPhase()" title="Skip to next phase">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="5 4 15 12 5 20"/>
                    <line x1="19" y1="4" x2="19" y2="20"/>
                </svg>
            </button>

            <button id="start-btn" class="start-btn" onclick="toggleTimer()">
                <svg id="play-icon" fill="currentColor" viewBox="0 0 20 20" style="width:1.1rem;height:1.1rem">
                    <path d="M4 4l12 6-12 6z"/>
                </svg>
                <svg id="pause-icon" class="hidden" fill="currentColor" viewBox="0 0 20 20" style="width:1.1rem;height:1.1rem">
                    <path d="M5 4h3v12H5V4zm7 0h3v12h-3V4z"/>
                </svg>
                <span id="start-text">Start</span>
            </button>

            <button class="icon-round-btn" onclick="resetTimer()" title="Reset phase">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 4v6h6M23 20v-6h-6"/>
                    <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Settings Drawer -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="handleOverlayClick(event)">
        <div class="drawer" id="drawer">
            <div class="drawer-header">
                <span class="drawer-title">Settings</span>
                <button class="drawer-close" onclick="closeSettings()">&#x2715;</button>
            </div>
            <div class="drawer-body">

                <!-- Profile List -->
                <div>
                    <div class="section-label">Your Profiles</div>
                    <div id="profile-list" style="display:flex;flex-direction:column;gap:0.5rem;"></div>
                </div>

                <!-- Profile Builder -->
                <div class="builder-card">
                    <div class="section-label">Build New Profile</div>

                    <div class="field-group">
                        <label>Profile Name</label>
                        <input type="text" id="new-profile-name" placeholder="e.g. Pomodoro Flow">
                    </div>

                    <div class="toggle-row">
                        <span class="toggle-label">Auto-start next phase</span>
                        <label class="toggle">
                            <input type="checkbox" id="new-profile-autostart" checked>
                            <span class="toggle-track"></span>
                        </label>
                    </div>
                    <div class="toggle-row">
                        <span class="toggle-label">Loop sequence</span>
                        <label class="toggle">
                            <input type="checkbox" id="new-profile-loop" checked>
                            <span class="toggle-track"></span>
                        </label>
                    </div>

                    <div class="divider" style="margin: 1rem 0;"></div>

                    <!-- Draft phases list -->
                    <div class="draft-phase-list" id="new-phase-list"></div>

                    <!-- Phase adder -->
                    <div class="phase-builder-inputs">
                        <input type="text" id="new-phase-name" placeholder="Phase name (e.g. Work)"
                            style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;font-family:inherit;font-size:0.85rem;padding:0.5rem 0.65rem;border-radius:0.5rem;outline:none;width:100%;transition:border-color 0.2s;"
                            onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
                        <input type="number" id="new-phase-time" placeholder="Mins" min="0.1" step="0.1"
                            style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;font-family:inherit;font-size:0.85rem;padding:0.5rem 0.65rem;border-radius:0.5rem;outline:none;width:100%;transition:border-color 0.2s;"
                            onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
                    </div>

                    <div class="color-swatches" id="color-swatches">
                        <button class="swatch-btn selected" style="background:#e05c74" data-color="#e05c74" onclick="selectColor(this,'#e05c74')"></button>
                        <button class="swatch-btn" style="background:#2da89a" data-color="#2da89a" onclick="selectColor(this,'#2da89a')"></button>
                        <button class="swatch-btn" style="background:#5b82e8" data-color="#5b82e8" onclick="selectColor(this,'#5b82e8')"></button>
                        <button class="swatch-btn" style="background:#d4883a" data-color="#d4883a" onclick="selectColor(this,'#d4883a')"></button>
                        <button class="swatch-btn" style="background:#8a6be0" data-color="#8a6be0" onclick="selectColor(this,'#8a6be0')"></button>
                        <button class="swatch-btn" style="background:#d0608e" data-color="#d0608e" onclick="selectColor(this,'#d0608e')"></button>
                        <button class="swatch-btn" style="background:#2da878" data-color="#2da878" onclick="selectColor(this,'#2da878')"></button>
                        <label class="swatch-btn custom-swatch" title="Custom color">
                            <input type="color" id="custom-color" value="#f43f5e" oninput="selectColor(null,this.value)">
                        </label>
                    </div>

                    <div class="drawer-btn-row" style="margin-bottom:0.75rem;">
                        <button class="drawer-btn drawer-btn-ghost" onclick="addDraftPhase()">+ Add Phase</button>
                    </div>
                    <button class="drawer-btn drawer-btn-accent" onclick="saveNewProfile()">Save Profile</button>
                </div>

                <!-- Data management -->
                <div>
                    <div class="section-label">Data</div>
                    <div class="drawer-btn-row">
                        <button class="drawer-btn drawer-btn-ghost" onclick="exportData()">
                            ↓ Export
                        </button>
                        <button class="drawer-btn drawer-btn-ghost" onclick="document.getElementById('import-file').click()">
                            ↑ Import
                        </button>
                    </div>
                    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
                </div>

            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () =>
                navigator.serviceWorker.register('sw.js').catch(() => {})
            );
        }

        // ===== CONSTANTS =====
        const RING_CIRCUMFERENCE = 2 * Math.PI * 118; // ~741.4

        // ===== DATA =====
        const defaultProfiles = {
            pomodoro: {
                name: 'Classic Pomodoro',
                autoStart: true,
                loop: true,
                sequence: [
                    { name: 'Work',        time: 25 * 60, color: '#e05c74' },
                    { name: 'Short Break', time:  5 * 60, color: '#2da89a' },
                    { name: 'Work',        time: 25 * 60, color: '#e05c74' },
                    { name: 'Short Break', time:  5 * 60, color: '#2da89a' },
                    { name: 'Work',        time: 25 * 60, color: '#e05c74' },
                    { name: 'Long Break',  time: 15 * 60, color: '#5b82e8' },
                ]
            }
        };

        let profiles = null;
        try { const r = localStorage.getItem('timergo-profiles-v2'); if (r) profiles = JSON.parse(r); } catch(e) {}
        if (!profiles) profiles = defaultProfiles;

        let currentProfileId = localStorage.getItem('timergo-current-profile-v2') || 'pomodoro';
        if (!profiles[currentProfileId]) currentProfileId = Object.keys(profiles)[0];

        let currentPhaseIndex = 0;
        let timeLeft = 0;
        let totalPhaseTime = 0;
        let timerId = null;
        let isRunning = false;
        let endTime = null;
        let audioCtx = null;
        let draftPhases = [];
        let selectedNewColor = '#f43f5e';

        // ===== DOM REFS =====
        const display        = document.getElementById('timer-display');
        const phaseLabel     = document.getElementById('phase-label');
        const startBtnText   = document.getElementById('start-text');
        const playIcon       = document.getElementById('play-icon');
        const pauseIcon      = document.getElementById('pause-icon');
        const ringProgress   = document.getElementById('ring-progress');
        const profileSelect  = document.getElementById('profile-select');
        const root           = document.documentElement;

        // ===== AUDIO =====
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            requestNotificationPermission();
        }

        function playChime() {
            try {
                if (!audioCtx) return;
                const t = audioCtx.currentTime;
                [880, 1100, 1320].forEach((freq, i) => {
                    const osc  = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, t + i * 0.18);
                    gain.gain.linearRampToValueAtTime(0.35, t + i * 0.18 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.18 + 0.8);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t + i * 0.18);
                    osc.stop(t + i * 0.18 + 0.8);
                });
            } catch(e) {}
        }

        // ===== TIMER CORE =====
        function getActivePhase() {
            const p = profiles[currentProfileId];
            if (!p || !p.sequence || !p.sequence.length) return null;
            return p.sequence[currentPhaseIndex];
        }

        function updateDisplay() {
            const t = Math.max(0, timeLeft);
            const m = Math.floor(t / 60);
            const s = t % 60;
            const str = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            display.textContent = str;

            // Update ring
            const pct = totalPhaseTime > 0 ? t / totalPhaseTime : 1;
            ringProgress.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - pct);

            const phase = getActivePhase();
            document.title = `${str} — ${phase ? phase.name : 'TimerGo'} | TimerGo`;
        }

        function setAccent(color) {
            root.style.setProperty('--accent', color);
            root.style.setProperty('--accent-glow', hexToGlow(color));
            // Body stays dark; blobs pick up color via CSS var(--accent)
            ringProgress.style.stroke = color;
        }

        function hexToGlow(hex) {
            // Parse and return rgba with 35% opacity
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);
            return `rgba(${r},${g},${b},0.4)`;
        }

        function toggleTimer() {
            initAudio();
            const phase = getActivePhase();
            if (!phase) return;

            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                timeLeft = Math.max(0, Math.round((endTime - Date.now()) / 1000));
                setStartBtnState(false);
                updateDisplay();
            } else {
                if (timeLeft <= 0) timeLeft = phase.time;
                isRunning = true;
                endTime = Date.now() + timeLeft * 1000;
                setStartBtnState(true);
                updateDisplay();

                timerId = setInterval(() => {
                    timeLeft = Math.max(0, Math.round((endTime - Date.now()) / 1000));
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        isRunning = false;
                        playChime();
                        sendNotification();
                        setStartBtnState(false);
                        flashDone();
                        setTimeout(() => {
                            if (!isRunning && timeLeft <= 0) advancePhase();
                        }, 2000);
                    }
                }, 100);
            }
        }

        function setStartBtnState(running) {
            if (running) {
                startBtnText.textContent = 'Pause';
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                startBtnText.textContent = 'Start';
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function flashDone() {
            const el = document.createElement('div');
            el.className = 'done-flash';
            document.body.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            const phase = getActivePhase();
            timeLeft = phase ? phase.time : 25 * 60;
            totalPhaseTime = timeLeft;
            setStartBtnState(false);
            updateDisplay();
        }

        function skipPhase() {
            clearInterval(timerId);
            isRunning = false;
            setStartBtnState(false);
            advancePhase();
        }

        function editTimer() {
            if (isRunning) toggleTimer();
            const curMins = Math.ceil(timeLeft / 60) || 1;
            const input = prompt('Enter new time in minutes:', curMins);
            if (input !== null) {
                const mins = parseFloat(input);
                if (!isNaN(mins) && mins > 0) {
                    timeLeft = Math.round(mins * 60);
                    totalPhaseTime = timeLeft;
                    updateDisplay();
                }
            }
        }

        function advancePhase() {
            const p = profiles[currentProfileId];
            if (!p) return;
            let next = currentPhaseIndex + 1;
            if (next >= p.sequence.length) {
                if (p.loop) next = 0;
                else { resetTimer(); return; }
            }
            applyPhase(next, p.autoStart);
        }

        // ===== PROFILE / PHASE =====
        function applyPhase(index, autoStart = false) {
            const p = profiles[currentProfileId];
            if (!p || !p.sequence || !p.sequence.length) return;
            currentPhaseIndex = index;
            const phase = p.sequence[index];
            totalPhaseTime = phase.time;

            setAccent(phase.color);
            phaseLabel.textContent = phase.name;
            renderPhases();
            resetTimer();

            if (autoStart) toggleTimer();
        }

        function renderPhases() {
            const c = document.getElementById('phases-container');
            c.innerHTML = '';
            const p = profiles[currentProfileId];
            if (!p) return;
            p.sequence.forEach((phase, i) => {
                const btn = document.createElement('button');
                btn.className = `phase-tab${i === currentPhaseIndex ? ' active' : ''}`;
                btn.textContent = phase.name;
                btn.onclick = () => {
                    if (isRunning) toggleTimer();
                    applyPhase(i, false);
                };
                c.appendChild(btn);
            });
        }

        function initProfileSelect() {
            profileSelect.innerHTML = '';
            Object.keys(profiles).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = profiles[key].name;
                profileSelect.appendChild(opt);
            });
            profileSelect.value = currentProfileId;
        }

        profileSelect.addEventListener('change', e => {
            clearInterval(timerId);
            isRunning = false;
            currentProfileId = e.target.value;
            currentPhaseIndex = 0;
            localStorage.setItem('timergo-current-profile-v2', currentProfileId);
            applyPhase(0, false);
        });

        function saveProfiles() {
            localStorage.setItem('timergo-profiles-v2', JSON.stringify(profiles));
            initProfileSelect();
            renderPhases();
        }

        // ===== SETTINGS DRAWER =====
        function openSettings() {
            document.getElementById('drawer-overlay').classList.add('active');
            renderProfileList();
            document.getElementById('new-profile-name').value = '';
            draftPhases = [];
            renderDraftPhases();
        }

        function closeSettings() {
            document.getElementById('drawer-overlay').classList.remove('active');
        }

        function handleOverlayClick(e) {
            if (e.target === document.getElementById('drawer-overlay')) closeSettings();
        }

        function renderProfileList() {
            const list = document.getElementById('profile-list');
            list.innerHTML = '';
            Object.keys(profiles).forEach(key => {
                const p = profiles[key];
                const totalSec = p.sequence.reduce((a, b) => a + b.time, 0);
                const swatches = [...new Map(p.sequence.map(ph => [ph.color, ph])).values()]
                    .slice(0, 4)
                    .map(ph => `<div class="swatch-dot" style="background:${ph.color}"></div>`)
                    .join('');

                const card = document.createElement('div');
                card.className = `profile-card${key === currentProfileId ? ' active-profile' : ''}`;
                card.innerHTML = `
                    <div class="profile-card-left">
                        <div class="profile-card-swatch">${swatches}</div>
                        <div class="profile-card-info">
                            <div class="name">${p.name}</div>
                            <div class="meta">${p.sequence.length} phases · ${Math.round(totalSec/60)}m total</div>
                        </div>
                    </div>
                    <button class="profile-delete-btn" onclick="deleteProfile('${key}',event)" title="Delete">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                `;
                card.querySelector('.profile-card-left').onclick = () => {
                    clearInterval(timerId); isRunning = false;
                    currentProfileId = key;
                    currentPhaseIndex = 0;
                    localStorage.setItem('timergo-current-profile-v2', currentProfileId);
                    initProfileSelect();
                    applyPhase(0, false);
                    closeSettings();
                };
                list.appendChild(card);
            });
        }

        function selectColor(el, color) {
            selectedNewColor = color;
            document.querySelectorAll('.swatch-btn:not(.custom-swatch)').forEach(b => b.classList.remove('selected'));
            if (el && !el.classList.contains('custom-swatch')) el.classList.add('selected');
            document.getElementById('custom-color').value = color;
        }

        function addDraftPhase() {
            const name = document.getElementById('new-phase-name').value.trim();
            const mins = parseFloat(document.getElementById('new-phase-time').value);
            if (!name || isNaN(mins) || mins <= 0) {
                alert('Enter a valid phase name and duration.');
                return;
            }
            draftPhases.push({ name, time: Math.round(mins * 60), color: selectedNewColor });
            renderDraftPhases();
            document.getElementById('new-phase-name').value = '';
            document.getElementById('new-phase-time').value = '';
        }

        function renderDraftPhases() {
            const list = document.getElementById('new-phase-list');
            list.innerHTML = '';
            draftPhases.forEach((ph, idx) => {
                const item = document.createElement('div');
                item.className = 'draft-phase-item';
                item.innerHTML = `
                    <div class="draft-phase-item-left">
                        <div class="draft-dot" style="background:${ph.color}"></div>
                        ${ph.name} <span style="color:rgba(255,255,255,0.4);margin-left:0.25rem">${Math.round(ph.time/60)}m</span>
                    </div>
                    <button class="draft-remove" onclick="removeDraftPhase(${idx})">✕</button>
                `;
                list.appendChild(item);
            });
        }

        function removeDraftPhase(idx) {
            draftPhases.splice(idx, 1);
            renderDraftPhases();
        }

        function saveNewProfile() {
            const name = document.getElementById('new-profile-name').value.trim();
            const autoStart = document.getElementById('new-profile-autostart').checked;
            const loop = document.getElementById('new-profile-loop').checked;
            if (!name) return alert('Enter a profile name.');
            if (!draftPhases.length) return alert('Add at least one phase.');

            const key = 'custom_' + Date.now();
            profiles[key] = { name, autoStart, loop, sequence: [...draftPhases] };
            saveProfiles();

            clearInterval(timerId); isRunning = false;
            currentProfileId = key;
            currentPhaseIndex = 0;
            localStorage.setItem('timergo-current-profile-v2', currentProfileId);
            applyPhase(0, false);
            closeSettings();
        }

        function deleteProfile(key, e) {
            e.stopPropagation();
            if (Object.keys(profiles).length <= 1) { alert('Must keep at least one profile.'); return; }
            if (!confirm(`Delete "${profiles[key].name}"?`)) return;
            delete profiles[key];
            if (currentProfileId === key) {
                currentProfileId = Object.keys(profiles)[0];
                localStorage.setItem('timergo-current-profile-v2', currentProfileId);
                applyPhase(0, false);
            }
            saveProfiles();
            renderProfileList();
        }

        // ===== IMPORT / EXPORT =====
        function exportData() {
            const blob = new Blob([JSON.stringify(profiles, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'timergo_profiles.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (typeof parsed === 'object' && Object.keys(parsed).length > 0) {
                        profiles = parsed;
                        currentProfileId = Object.keys(profiles)[0];
                        localStorage.setItem('timergo-current-profile-v2', currentProfileId);
                        saveProfiles();
                        renderProfileList();
                        applyPhase(0, false);
                        alert('Profiles imported!');
                    }
                } catch { alert('Invalid JSON file.'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ===== NOTIFICATIONS / FULLSCREEN =====
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        function sendNotification() {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('TimerGo', {
                    body: "Time's up! Moving to next phase…",
                    icon: 'icon.svg'
                });
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        // ===== INIT =====
        ringProgress.style.strokeDasharray = RING_CIRCUMFERENCE;
        initProfileSelect();
        applyPhase(0, false);
    </script>
</body>
</html>
